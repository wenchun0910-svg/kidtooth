<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>學生潔牙記錄表</title>
<style>
:root {
  --green: #287b52;
  --bg: #f1f8f3;
  --ink: #294537;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  padding: 22px 14px 36px;
  background: var(--bg);
  color: var(--ink);
  font-family: "Microsoft JhengHei", sans-serif;
}
main { max-width: 850px; margin: auto; }
h1 {
  color: var(--green);
  text-align: center;
  margin: 8px 0;
}
.subtitle {
  text-align: center;
  color: #718278;
  margin-bottom: 24px;
}
.toolbar {
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  margin-bottom: 18px;
}
input, button { font: inherit; }
input[type="date"] {
  padding: 9px;
  border: 1px solid #cfddd2;
  border-radius: 9px;
  background: white;
}
button {
  border: 0;
  border-radius: 9px;
  padding: 10px 14px;
  cursor: pointer;
}
.clear-btn {
  background: #64776c;
  color: white;
}
.summary {
  background: white;
  border-radius: 15px;
  padding: 16px;
  box-shadow: 0 3px 12px #2448320c;
  margin-bottom: 20px;
}
.progress {
  height: 10px;
  background: #e5eee7;
  border-radius: 20px;
  overflow: hidden;
  margin-top: 12px;
}
#progressBar {
  height: 100%;
  width: 0;
  background: #43a875;
  transition: width .2s;
}
.grid {
  display: grid;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  gap: 13px;
}
.tooth-button {
  position: relative;
  min-width: 0;
  aspect-ratio: 1 / 1.05;
  padding: 0;
  background: transparent;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--ink);
  -webkit-tap-highlight-color: transparent;
}
.tooth-button svg {
  position: absolute;
  width: 100%;
  height: 100%;
  inset: 0;
  overflow: visible;
  filter: drop-shadow(0 3px 3px #25452a10);
}
.tooth-button .tooth-shape {
  fill: var(--tooth-fill, #fff);
  stroke: var(--tooth-color, #b8d6c0);
  stroke-width: 3.5;
  stroke-linejoin: round;
  transition: fill .18s, stroke .18s, transform .18s;
}
.tooth-button .number {
  position: relative;
  z-index: 1;
  font-size: clamp(17px, 3.3vw, 25px);
  font-weight: 800;
  color: var(--number-color, #315d43);
  pointer-events: none;
}
.tooth-button:active .tooth-shape {
  transform: scale(.94);
}
.tooth-button:focus-visible {
  outline: 3px solid #367bd5;
  outline-offset: 2px;
  border-radius: 12px;
}
.tooth-button[aria-pressed="true"] .number {
  color: #fff;
}
.legend {
  display: flex;
  flex-wrap: wrap;
  gap: 10px 18px;
  justify-content: center;
  margin: 22px 0 8px;
  font-size: 14px;
  color: #52695b;
}
.dot {
  display: inline-block;
  width: 13px;
  height: 13px;
  border-radius: 50%;
  margin-right: 5px;
  vertical-align: -2px;
}
.hint {
  text-align: center;
  color: #718278;
  font-size: 13px;
  line-height: 1.7;
}
@media (max-width: 480px) {
  body { padding: 14px 9px 26px; }
  .grid { gap: 7px; }
  .summary { padding: 12px; }
  .toolbar { align-items: stretch; }
}
</style>
</head>
<body>
<main>
  <h1>🪥 學生潔牙記錄表</h1>
  <p class="subtitle">每天潔牙，笑容亮晶晶！</p>

  <div class="toolbar">
    <label>
      檢查日期：
      <input type="date" id="checkDate">
    </label>
    <button class="clear-btn" id="clearBtn">清空當日顏色</button>
  </div>

  <section class="summary">
    <strong id="summaryText">已標記 0 / 20 人</strong>
    <div class="progress">
      <div id="progressBar"></div>
    </div>
    <p id="detailText">完成率：0%</p>
  </section>

  <section class="grid" id="studentGrid" aria-label="學生潔牙號碼"></section>

  <div class="legend">
    <span><i class="dot" style="background:#48a978"></i>綠色</span>
    <span><i class="dot" style="background:#f0a45c"></i>橘色</span>
    <span><i class="dot" style="background:#9c85d9"></i>紫色</span>
    <span><i class="dot" style="background:#59a9dc"></i>藍色</span>
    <span><i class="dot" style="background:#e6c64e"></i>黃色</span>
  </div>
  <p class="hint">
    點擊牙齒號碼即可切換顏色，再點一次可切換下一種顏色。<br>
    顏色及日期紀錄會自動儲存在目前瀏覽器。
  </p>
</main>

<script>
const TOTAL = 20;
const COLORS = [
  { name: "未標記", fill: "#ffffff", stroke: "#b8d6c0", text: "#315d43" },
  { name: "綠色", fill: "#48a978", stroke: "#31875b", text: "#ffffff" },
  { name: "橘色", fill: "#f0a45c", stroke: "#d8863b", text: "#ffffff" },
  { name: "紫色", fill: "#9c85d9", stroke: "#8068bd", text: "#ffffff" },
  { name: "藍色", fill: "#59a9dc", stroke: "#378bc1", text: "#ffffff" },
  { name: "黃色", fill: "#e6c64e", stroke: "#c4a72f", text: "#594a0c" }
];
const KEY_PREFIX = "toothColorTracker20:";

function localDateString() {
  const d = new Date();
  return d.getFullYear() + "-" +
    String(d.getMonth() + 1).padStart(2, "0") + "-" +
    String(d.getDate()).padStart(2, "0");
}
function readColors(key) {
  try {
    const data = JSON.parse(localStorage.getItem(key));
    if (Array.isArray(data)) {
      return Array.from({length: TOTAL}, (_, i) => {
        const value = Number(data[i]);
        return Number.isInteger(value) && value >= 0 &&
          value < COLORS.length ? value : 0;
      });
    }
  } catch (e) {}
  return Array(TOTAL).fill(0);
}
const dateInput = document.getElementById("checkDate");
dateInput.value = localDateString();

function storageKey() {
  return KEY_PREFIX + dateInput.value;
}
let states = readColors(storageKey());

function save() {
  localStorage.setItem(storageKey(), JSON.stringify(states));
}
function makeTooth(number) {
  const button = document.createElement("button");
  button.type = "button";
  button.className = "tooth-button";
  button.setAttribute("aria-label", "第 " + number + " 號學生");
  button.setAttribute("aria-pressed", "false");

  // 以 SVG 畫出牙齒外框，不使用圓形按鈕。
  button.innerHTML = `
    <svg viewBox="0 0 100 108" aria-hidden="true">
      <path class="tooth-shape"
        d="M50 13
           C39 5 22 9 15 21
           C6 36 17 51 23 64
           C28 77 27 95 37 98
           C46 101 45 77 50 72
           C55 77 54 101 63 98
           C73 95 72 77 77 64
           C83 51 94 36 85 21
           C78 9 61 5 50 13 Z"/>
    </svg>
    <span class="number">${number}</span>
  `;

  button.addEventListener("click", () => {
    states[number - 1] = (states[number - 1] + 1) % COLORS.length;
    save();
    render();
  });
  return button;
}

const grid = document.getElementById("studentGrid");
for (let i = 1; i <= TOTAL; i++) {
  grid.appendChild(makeTooth(i));
}

function render() {
  const buttons = grid.querySelectorAll(".tooth-button");
  states.forEach((state, i) => {
    const color = COLORS[state];
    const button = buttons[i];
    button.style.setProperty("--tooth-fill", color.fill);
    button.style.setProperty("--tooth-color", color.stroke);
    button.style.setProperty("--number-color", color.text);
    button.setAttribute("aria-pressed", state === 0 ? "false" : "true");
    button.title = (i + 1) + " 號：" + color.name;
  });

  const completed = states.filter(value => value !== 0).length;
  const percent = Math.round(completed / TOTAL * 100);
  document.getElementById("summaryText").textContent =
    "已標記 " + completed + " / " + TOTAL + " 人";
  document.getElementById("detailText").textContent =
    "完成率：" + percent + "%";
  document.getElementById("progressBar").style.width = percent + "%";
}

dateInput.addEventListener("change", () => {
  if (!dateInput.value) dateInput.value = localDateString();
  states = readColors(storageKey());
  render();
});

document.getElementById("clearBtn").addEventListener("click", () => {
  if (confirm("確定清空 " + dateInput.value + " 的所有號碼顏色嗎？")) {
    states = Array(TOTAL).fill(0);
    save();
    render();
  }
});

render();
</script>
</body>
</html>
